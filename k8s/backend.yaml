apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-hunt
  namespace: data-hunt
  labels:
    app.kubernetes.io/name: data-hunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-hunt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-hunt
    spec:
      containers:
        - name: data-hunt
          image: dushes/data-hunt@sha256:5c8c095eec7622377af3ff188ea6163a6fe9a86f09e5fdfd73aa5e6d5f91b83c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8111
          envFrom:
            - secretRef:
                name: data-hunt-runtime
            - secretRef:
                name: data-hunt-coinbase-capsule
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: data-hunt-db
                  key: DATABASE_URL
            - name: REDIS_URL
              value: redis://data-hunt-redis:6379/0
            - name: OUTBOUND_QUEUE_MAX_WAIT_SECONDS
              value: "120"
            - name: OUTBOUND_QUEUE_429_RETRIES
              value: "2"
            - name: CSV_CACHE_FLIGHT_TIMEOUT_SECONDS
              value: "180"
            - name: CSV_CACHE_STALE_TTL_SECONDS
              value: "86400"
            - name: CSV_CACHE_REFRESH_TIMEOUT_SECONDS
              value: "8"
            - name: SHEETS_REFRESH_ENABLED
              value: "true"
            - name: SHEETS_REFRESH_DELAY_SECONDS
              value: "3540"
            - name: SHEETS_REFRESH_POLL_SECONDS
              value: "5"
            - name: VALUE_RATE_LIMIT_WINDOW_SECONDS
              value: "60"
            - name: VALUE_RATE_LIMIT_AUTHENTICATED
              value: "120"
            - name: FEATURE_REQUEST_ADMIN_ADDRESSES
              value: "0x6272AB4F91e0dF14AcB6a2A311d817381210E339"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-hunt
  namespace: data-hunt
  labels:
    app.kubernetes.io/name: data-hunt
spec:
  selector:
    app.kubernetes.io/name: data-hunt
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-hunt
  namespace: data-hunt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hunt.data.lisacorp.com
      secretName: data-hunt-app-tls
  rules:
    - host: hunt.data.lisacorp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data-hunt
                port:
                  name: http
---
