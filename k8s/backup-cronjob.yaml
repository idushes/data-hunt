apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-hunt-postgres-backup
  namespace: data-hunt
  labels:
    app.kubernetes.io/name: data-hunt-postgres-backup
    app.kubernetes.io/part-of: data-hunt
spec:
  schedule: "30 3 * * *"
  timeZone: Asia/Makassar
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: data-hunt-postgres-backup
            app.kubernetes.io/part-of: data-hunt
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: postgres-dump
              image: postgres@sha256:c189d272e4fcdd1ac419adee675d30be3d389c22ee770d593f15819d22a68a0d
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - -ec
              args:
                - |
                  set -Eeuo pipefail
                  backup_timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_name="data-hunt-${backup_timestamp}.dump"
                  pg_dump \
                    --dbname="${DATABASE_URL}" \
                    --format=custom \
                    --compress=9 \
                    --no-owner \
                    --no-acl \
                    --file="/backup/${backup_name}"
                  pg_restore --list "/backup/${backup_name}" >/dev/null
                  cd /backup
                  sha256sum "${backup_name}" >"${backup_name}.sha256"
                  printf '%s\n' "${backup_name}" >backup-name
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: data-hunt-db
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 999
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: s3-upload
              image: amazon/aws-cli@sha256:5b76c069e37cfa091ec6398dc683c09e0c9ef8ae2e557b0a36d931df34011227
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  set -eu
                  backup_name="$(cat /backup/backup-name)"
                  object_key="${S3_PREFIX}/${backup_name}"
                  checksum_key="${object_key}.sha256"

                  aws --endpoint-url "${S3_ENDPOINT}" s3 cp \
                    "/backup/${backup_name}" \
                    "s3://${S3_BUCKET}/${object_key}" \
                    --only-show-errors
                  aws --endpoint-url "${S3_ENDPOINT}" s3 cp \
                    "/backup/${backup_name}.sha256" \
                    "s3://${S3_BUCKET}/${checksum_key}" \
                    --only-show-errors

                  local_size="$(wc -c <"/backup/${backup_name}" | tr -d ' ')"
                  remote_size="$(aws --endpoint-url "${S3_ENDPOINT}" s3api head-object \
                    --bucket "${S3_BUCKET}" \
                    --key "${object_key}" \
                    --query ContentLength \
                    --output text)"
                  test "${local_size}" = "${remote_size}"
                  printf 'uploaded s3://%s/%s (%s bytes)\n' \
                    "${S3_BUCKET}" "${object_key}" "${remote_size}"
              envFrom:
                - configMapRef:
                    name: data-hunt-backup-config
                - secretRef:
                    name: data-hunt-backup-credentials
              env:
                - name: HOME
                  value: /cache
                - name: TMPDIR
                  value: /cache
                - name: AWS_PAGER
                  value: ""
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                runAsUser: 999
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: cache
                  mountPath: /cache
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 1Gi
            - name: cache
              emptyDir:
                sizeLimit: 1Gi
